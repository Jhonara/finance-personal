server:
  port: 8080

spring:
  application:
    name: finance-manager-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

legacy:
  migration:
    enabled: ${LEGACY_MIGRATION_ENABLED:false}
    mode: ${LEGACY_MIGRATION_MODE:DRY_RUN}
    batch-size: ${LEGACY_MIGRATION_BATCH_SIZE:500}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

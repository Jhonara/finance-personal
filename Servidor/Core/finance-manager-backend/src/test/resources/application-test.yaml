spring:
  datasource:
    url: jdbc:h2:mem:finance_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

jwt:
  secret: test-jwt-secret-for-isolated-context-tests-only
  expiration: 60000
  refresh-expiration: 2592000000

cors:
  allowed-origins: http://localhost

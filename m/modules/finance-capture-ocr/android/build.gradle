plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.jr.financecapture'
version = '1.0.0'

android {
  namespace 'com.jr.financecapture'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
